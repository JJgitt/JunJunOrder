name: Test, publish and deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hongyun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: junjun_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d junjun_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-test-only@localhost:5432/junjun_ci
      ADMIN_WECHAT_ID: ci-admin
      ADMIN_PASSWORD: ci-test-password
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --webpack
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/rendered-html.test.mjs tests/vision-normalization.test.mjs tests/courier-match.test.mjs tests/deploy-image-ref.test.mjs tests/time.test.mjs tests/order-copy.test.mjs
      - run: node scripts/bootstrap.mjs
      - run: node tests/order-uniqueness.integration.mjs
      - run: bash -n deploy/ci/deploy.sh deploy/ci/ssh-entry.sh deploy/ci/install-server-deploy.sh

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.ghcr_push.outputs.digest }}
      registry: ${{ steps.registry.outputs.name }}
      repository: ${{ steps.registry.outputs.repository }}
      seed: ${{ steps.registry.outputs.seed }}
      seed_repository: ${{ steps.registry.outputs.seed_repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Huawei SWR
        id: swr_login
        if: ${{ vars.SWR_REPOSITORY != '' }}
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.SWR_REGISTRY || 'swr.cn-north-4.myhuaweicloud.com' }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: hongyun:ci
          labels: |
            org.opencontainers.image.source=https://github.com/JJgitt/JunJunOrder
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push image to GHCR
        id: ghcr_push
        env:
          IMAGE_TAG: ghcr.io/jjgitt/junjunorder:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag hongyun:ci "$IMAGE_TAG"
          push_log=$(mktemp)
          docker push "$IMAGE_TAG" | tee "$push_log"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")
          digest="${digest##*@}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            digest=$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "$push_log" | tail -n 1)
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Push image to Huawei SWR
        id: swr_push
        if: ${{ vars.SWR_REPOSITORY != '' && steps.swr_login.outcome == 'success' }}
        continue-on-error: true
        env:
          SWR_HOST: ${{ vars.SWR_REGISTRY || 'swr.cn-north-4.myhuaweicloud.com' }}
          SWR_REPOSITORY: ${{ vars.SWR_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$SWR_HOST" =~ ^swr\.[a-z0-9-]+\.myhuaweicloud\.com$ ]] || exit 1
          [[ "$SWR_REPOSITORY" =~ ^[a-z0-9._-]+/[a-z0-9._-]+$ ]] || exit 1
          # SWR is the China hop. Do not push ACR from this US runner: Aliyun personal
          # ACR stalls on overseas-to-mainland uploads (official FAQ).
          tag="$SWR_HOST/$SWR_REPOSITORY:sha-${{ github.sha }}"
          docker tag hongyun:ci "$tag"
          timeout --signal=TERM --kill-after=30s 10m docker push "$tag"
      - name: Select deployment registry
        id: registry
        if: ${{ always() && steps.ghcr_push.outcome == 'success' }}
        env:
          REQUESTED_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          SWR_LOGIN_OUTCOME: ${{ steps.swr_login.outcome }}
          SWR_PUSH_OUTCOME: ${{ steps.swr_push.outcome }}
          SWR_HOST: ${{ vars.SWR_REGISTRY || 'swr.cn-north-4.myhuaweicloud.com' }}
          SWR_REPOSITORY: ${{ vars.SWR_REPOSITORY }}
          ACR_HOST: ${{ vars.ACR_REGISTRY || 'crpi-lz061y1f8ajv9wzf.cn-guangzhou.personal.cr.aliyuncs.com' }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          set -euo pipefail
          swr_ready=false
          [[ "$SWR_LOGIN_OUTCOME" == 'success' && "$SWR_PUSH_OUTCOME" == 'success' ]] && swr_ready=true
          seed=ghcr
          seed_repository='ghcr.io/jjgitt/junjunorder'
          if [[ "$swr_ready" == true ]]; then
            seed=swr
            seed_repository="$SWR_HOST/$SWR_REPOSITORY"
          fi
          case "$REQUESTED_REGISTRY" in
            ghcr)
              selected=ghcr
              repository='ghcr.io/jjgitt/junjunorder'
              seed=ghcr
              seed_repository='ghcr.io/jjgitt/junjunorder'
              ;;
            swr)
              if [[ "$swr_ready" == true ]]; then
                selected=swr
                repository="$SWR_HOST/$SWR_REPOSITORY"
              else
                selected=ghcr
                repository='ghcr.io/jjgitt/junjunorder'
                echo '::warning::Huawei SWR is unavailable; deploying the identical digest from GHCR.'
              fi
              ;;
            *)
              if [[ -n "$ACR_REPOSITORY" ]]; then
                selected=acr
                repository="$ACR_HOST/$ACR_REPOSITORY"
              elif [[ "$swr_ready" == true ]]; then
                selected=swr
                repository="$SWR_HOST/$SWR_REPOSITORY"
              else
                selected=ghcr
                repository='ghcr.io/jjgitt/junjunorder'
              fi
              ;;
          esac
          echo "name=$selected" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "seed_repository=$seed_repository" >> "$GITHUB_OUTPUT"
          if [[ "$selected" == acr ]]; then
            echo "Deploy target is ACR; the China server will seed it from $seed_repository"
          fi

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: '113.46.133.47'
      DEPLOY_USER: junjun
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      REGISTRY_USER: ${{ needs.publish.outputs.registry == 'swr' && secrets.SWR_USERNAME || needs.publish.outputs.registry == 'acr' && secrets.ACR_USERNAME || github.actor }}
      REGISTRY_TOKEN: ${{ needs.publish.outputs.registry == 'swr' && secrets.SWR_PASSWORD || needs.publish.outputs.registry == 'acr' && secrets.ACR_PASSWORD || secrets.GITHUB_TOKEN }}
      SEED_USER: ${{ needs.publish.outputs.seed == 'swr' && secrets.SWR_USERNAME || github.actor }}
      SEED_TOKEN: ${{ needs.publish.outputs.seed == 'swr' && secrets.SWR_PASSWORD || secrets.GITHUB_TOKEN }}
      SEED_REPOSITORY: ${{ needs.publish.outputs.seed_repository || 'ghcr.io/jjgitt/junjunorder' }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      IMAGE_REPOSITORY: ${{ needs.publish.outputs.repository || 'ghcr.io/jjgitt/junjunorder' }}
      TARGET_REGISTRY: ${{ needs.publish.outputs.registry }}
    steps:
      - name: Deploy immutable image through restricted SSH command
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Missing DEPLOY_SSH_KEY repository secret'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Missing DEPLOY_KNOWN_HOSTS repository secret'; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$IMAGE_REPOSITORY" =~ ^(ghcr\.io/jjgitt/junjunorder|swr\.cn-north-4\.myhuaweicloud\.com/junjunorder/junjunorder|crpi-lz061y1f8ajv9wzf\.cn-guangzhou\.personal\.cr\.aliyuncs\.com/junjunorder/junjunorder)$ ]] || exit 1
          [[ "$SEED_REPOSITORY" =~ ^(ghcr\.io/jjgitt/junjunorder|swr\.cn-north-4\.myhuaweicloud\.com/junjunorder/junjunorder)$ ]] || exit 1
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          # Ephemeral registry credentials travel only through encrypted stdin.
          # ACR deploys send seed credentials so the China server can fill ACR locally.
          if [[ "${TARGET_REGISTRY:-}" == acr ]]; then
            printf '%s\n%s\n%s\n%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" "$SEED_USER" "$SEED_TOKEN" "$SEED_REPOSITORY"
          else
            printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN"
          fi | ssh \
            -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
      - name: Check public health endpoint
        run: curl --fail --retry 5 --retry-delay 3 --max-time 15 http://113.46.133.47/api/health
