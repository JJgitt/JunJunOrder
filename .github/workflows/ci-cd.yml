name: Test, publish and deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hongyun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: junjun_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d junjun_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-test-only@localhost:5432/junjun_ci
      ADMIN_WECHAT_ID: ci-admin
      ADMIN_PASSWORD: ci-test-password
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --webpack
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/rendered-html.test.mjs tests/vision-normalization.test.mjs tests/courier-match.test.mjs tests/deploy-image-ref.test.mjs tests/time.test.mjs
      - run: node scripts/bootstrap.mjs
      - run: node tests/order-uniqueness.integration.mjs
      - run: bash -n deploy/ci/deploy.sh deploy/ci/ssh-entry.sh deploy/ci/install-server-deploy.sh

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Huawei SWR
        if: ${{ vars.SWR_REPOSITORY != '' }}
        continue-on-error: ${{ vars.IMAGE_REGISTRY != 'swr' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.SWR_REGISTRY || 'swr.cn-north-4.myhuaweicloud.com' }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ghcr.io/jjgitt/junjunorder:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/JJgitt/JunJunOrder
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Mirror image to Huawei SWR
        if: ${{ vars.SWR_REPOSITORY != '' }}
        continue-on-error: ${{ vars.IMAGE_REGISTRY != 'swr' }}
        env:
          SWR_HOST: ${{ vars.SWR_REGISTRY || 'swr.cn-north-4.myhuaweicloud.com' }}
          SWR_REPOSITORY: ${{ vars.SWR_REPOSITORY }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$SWR_HOST" =~ ^swr\.[a-z0-9-]+\.myhuaweicloud\.com$ ]] || exit 1
          [[ "$SWR_REPOSITORY" =~ ^[a-z0-9._-]+/[a-z0-9._-]+$ ]] || exit 1
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$SWR_HOST/$SWR_REPOSITORY:sha-${{ github.sha }}" \
            "ghcr.io/jjgitt/junjunorder@$IMAGE_DIGEST"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: '113.46.133.47'
      DEPLOY_USER: junjun
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      REGISTRY_USER: ${{ vars.IMAGE_REGISTRY == 'swr' && secrets.SWR_USERNAME || github.actor }}
      REGISTRY_TOKEN: ${{ vars.IMAGE_REGISTRY == 'swr' && secrets.SWR_PASSWORD || secrets.GITHUB_TOKEN }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REGISTRY == 'swr' && 'swr.cn-north-4.myhuaweicloud.com/junjunorder/junjunorder' || 'ghcr.io/jjgitt/junjunorder' }}
    steps:
      - name: Deploy immutable image through restricted SSH command
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Missing DEPLOY_SSH_KEY repository secret'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Missing DEPLOY_KNOWN_HOSTS repository secret'; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$IMAGE_REPOSITORY" =~ ^(ghcr\.io/jjgitt/junjunorder|swr\.cn-north-4\.myhuaweicloud\.com/junjunorder/junjunorder)$ ]] || exit 1
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          # Two-line ephemeral registry credentials travel only through encrypted stdin.
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" | ssh \
            -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
      - name: Check public health endpoint
        run: curl --fail --retry 5 --retry-delay 3 --max-time 15 http://113.46.133.47/api/health
