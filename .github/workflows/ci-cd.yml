name: Test, publish and deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hongyun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: junjun_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d junjun_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-test-only@localhost:5432/junjun_ci
      ADMIN_WECHAT_ID: ci-admin
      ADMIN_PASSWORD: ci-test-password
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --webpack
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test tests/rendered-html.test.mjs tests/vision-normalization.test.mjs tests/courier-match.test.mjs tests/deploy-image-ref.test.mjs tests/time.test.mjs tests/order-copy.test.mjs tests/settlement-proof.test.mjs
      - run: node scripts/bootstrap.mjs
      - run: node tests/order-uniqueness.integration.mjs
      - run: bash -n deploy/ci/deploy.sh deploy/ci/ssh-entry.sh deploy/ci/install-server-deploy.sh

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      DEPLOY_HOST: '113.46.133.47'
      DEPLOY_USER: junjun
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      REGISTRY_USER: ${{ secrets.ACR_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.ACR_PASSWORD }}
      IMAGE_REF: crpi-lz061y1f8ajv9wzf.cn-guangzhou.personal.cr.aliyuncs.com/junjunorder/junjunorder:main#${{ github.sha }}
    steps:
      - name: Wait for the China ACR build and deploy its digest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'Missing DEPLOY_SSH_KEY repository secret'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Missing DEPLOY_KNOWN_HOSTS repository secret'; exit 1; }
          test -n "$REGISTRY_USER" || { echo 'Missing ACR_USERNAME repository secret'; exit 1; }
          test -n "$REGISTRY_TOKEN" || { echo 'Missing ACR_PASSWORD repository secret'; exit 1; }
          [[ "$IMAGE_REF" =~ ^crpi-lz061y1f8ajv9wzf\.cn-guangzhou\.personal\.cr\.aliyuncs\.com/junjunorder/junjunorder:main#[0-9a-f]{40}$ ]] || exit 1
          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          # ACR login travels only through encrypted stdin. The server polls tag main
          # until /app/source-revision matches this commit, then deploys that digest.
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" | ssh \
            -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=70 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$IMAGE_REF"
      - name: Check public health endpoint
        run: curl --fail --retry 5 --retry-delay 3 --max-time 15 http://113.46.133.47/api/health
